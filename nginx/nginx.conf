user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

load_module modules/ndk_http_module.so;
load_module modules/ngx_http_lua_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /app/logs/nginx-access.log main;
    error_log /app/logs/nginx-error.log error;
    error_log /app/logs/nginx-info.log info;
    error_log stderr error;

    # Lua integration
    lua_package_path "/app/lua/?.lua;/usr/local/lib/lua/5.1/?.lua;;";

    lua_shared_dict system_data 1m;
    lua_shared_dict sessions 10m;

    init_by_lua_block {
        ngx.shared.system_data:set("startup_time", ngx.time())
        
        local system_init = require "init"
        local success = system_init.init()
        
        if not success then
            ngx.log(ngx.ERR, "CRITICAL: System initialization failed - server may not function correctly")
        end
    }
    
    init_worker_by_lua_block {
        local system_init = require "init"
        local success = system_init.init_worker()
        
        if not success then
            ngx.log(ngx.ERR, "Failed to initialize worker components")
        end
        
        local sessions = require "sessions.init"
        local SessionManager = sessions.SessionManager
        local SessionMonitor = sessions.SessionMonitor
        
        SessionManager.setup_cleanup_timer()
        SessionMonitor.setup_monitoring_timer()
    }

    # DNS resolver includes Docker DNS for service discovery
    resolver 127.0.0.11 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 30s;

    sendfile on;
    keepalive_timeout 65;
    
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=120r/m;

    # Paths that should skip authentication
    map $uri $auth_skip {
        default 0;
        ~^/(auth|login|static/|health|favicon\.ico|_error/) 1;
    }

    include /app/nginx/server.conf;
}