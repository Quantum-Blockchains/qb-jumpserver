server {
    # Listen directive replaced by startup script based on HTTPS_ENABLED
    listen 8080;
    http2 on;
    server_name localhost;
    
    include /app/nginx/ssl.conf;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' *; frame-src 'self' *;" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # HSTS header only when HTTPS is enabled
    header_filter_by_lua_block {
        local https_enabled = os.getenv("HTTPS_ENABLED")
        if https_enabled == "true" and ngx.var.https == "on" then
            ngx.header["Strict-Transport-Security"] = "max-age=31536000; includeSubDomains"
        end
    }
    
    set $user_id "";
    set $user_email "";
    set $user_name "";
    
    access_by_lua_block {
        local ok, session_uid = pcall(require, "utils.session_uid")
        if ok and session_uid and session_uid.ensure then
            pcall(session_uid.ensure)
        end
    }
        
    location = / {
        access_by_lua_block {
            local auth_service = require "auth.auth_service"
            if auth_service.is_authenticated() then
                return ngx.redirect("/dashboard", ngx.HTTP_TEMPORARY_REDIRECT)
            else
                return ngx.redirect("/login", ngx.HTTP_TEMPORARY_REDIRECT)
            end
        }
    }

    location /static/ {
        alias /app/nginx/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' *; frame-src 'self' *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        tcp_nopush on;
        tcp_nodelay on;
    }

    location /auth/ {
        limit_req zone=auth burst=15 nodelay;
        content_by_lua_block {
            local auth_endpoints = require "auth.auth_endpoints"
            auth_endpoints.handle_request()
        }
    }
    
    location = /login {
        limit_req zone=auth burst=15 nodelay;
        access_by_lua_block {
            local auth_service = require "auth.auth_service"
            if auth_service.is_authenticated() then
                return ngx.redirect("/dashboard", ngx.HTTP_TEMPORARY_REDIRECT)
            end
        }
        root /app/nginx/static/html;
        default_type text/html;
        try_files /login.html =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' *; frame-src 'self' *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /dashboard {
        limit_req zone=general burst=10 nodelay;
        access_by_lua_file /app/lua/auth/require_auth.lua;
        root /app/nginx/static/html;
        default_type text/html;
        try_files /dashboard.html =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' *; frame-src 'self' *;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
    
    location = /administration {
        limit_req zone=general burst=10 nodelay;
        access_by_lua_block {
            local middleware = require "auth.auth_service"
            local ok = middleware.require_admin()
            if not ok then return ngx.exit(ngx.HTTP_FORBIDDEN) end
        }
        root /app/nginx/static/html;
        default_type text/html;
        try_files /administration.html =404;
    }
    
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    location /api/health {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        access_by_lua_file /app/lua/auth/require_auth.lua;
        content_by_lua_block {
            local api_router = require "handlers.api_router"
            api_router.handle_request()
        }
    }
    
    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        error_page 429 = @api_rate_limited;
        access_by_lua_file /app/lua/auth/require_auth.lua;
        content_by_lua_block {
            local api_router = require "handlers.api_router"
            api_router.handle_request()
        }
    }

    location @api_rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":"rate_limited","message":"Too many requests. Please retry later."}';
    }

    location /api/docs {
        rewrite ^/api/docs$ /api/v1/admin/docs last;
    }

    include /app/nginx/proxy.conf;

    location ~ ^/_error/(400|401|403|404|405|500|502|503|504)$ {
        root /app/nginx/static/html;
        default_type text/html;
        try_files /error.html =404;
    }

    error_page 400 /_error/400;
    error_page 401 /_error/401;
    error_page 403 /_error/403;
    error_page 404 /_error/404;
    error_page 405 /_error/405;
    error_page 500 /_error/500;
    error_page 502 /_error/502;
    error_page 503 /_error/503;
    error_page 504 /_error/504;

    location / {
        if ($auth_skip = 1) {
            return 404;
        }
        access_by_lua_block {
            local auth_service = require "auth.auth_service"
            if auth_service.is_authenticated() then
                return ngx.redirect("/dashboard", ngx.HTTP_TEMPORARY_REDIRECT)
            else
                return ngx.redirect("/", ngx.HTTP_TEMPORARY_REDIRECT)
            end
        }
    }

    log_by_lua_block {
        local ok_s, session_uid = pcall(require, "utils.session_uid")
        if ok_s and session_uid and session_uid.ensure_for_logging then 
            pcall(session_uid.ensure_for_logging) 
        end
        local ok_m, monitoring = pcall(require, "monitoring.init")
        if ok_m and monitoring and monitoring.record_access then 
            pcall(monitoring.record_access) 
        end
    }
}
