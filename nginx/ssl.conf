# SSL/TLS configuration (conditionally loaded when HTTPS_ENABLED=true)
# Certificates mounted from host via docker-compose volumes using SSL_CERT_PATH/SSL_KEY_PATH

ssl_certificate /app/certs/tls.crt;
ssl_certificate_key /app/certs/tls.key;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
