# HTTP service reverse proxy routing
location ~ ^/http/([^/]+)(/.*)?$ {
    set $service_id $1;
    set $request_path $2;
    
    set $service_host "";
    set $service_port "";
    set $service_protocol "";
    set $service_base_path "/";
    set $final_path "/";
    
    resolver 127.0.0.11 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    access_by_lua_file /app/lua/entrypoints/http_service_access.lua;

    # Disable security headers that interfere with proxied content
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "" always;
    add_header Content-Security-Policy "" always;

    proxy_http_version 1.1;
    
    # Disable compression so sub_filter can rewrite content
    proxy_set_header Accept-Encoding "";
    
    proxy_set_header Host $service_host:$service_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Rewrite response headers (Location, Set-Cookie)
    header_filter_by_lua_file /app/lua/entrypoints/http_proxy_filter.lua;
    
    # Rewrite response body (URLs in JavaScript/CSS)
    body_filter_by_lua_file /app/lua/entrypoints/http_proxy_body_filter.lua;
    
    # Native sub_filter URL rewriting
    sub_filter_once off;
    sub_filter_types text/css text/javascript application/javascript application/x-javascript application/json;
    
    # Inject base tag and proxy interceptor
    sub_filter '<head>' '<head><base href="/http/$service_id/"><script>window.__PROXY_BASE__="/http/$service_id";</script><script src="/static/js/interceptor.js"></script>';
    
    # Rewrite absolute paths in HTML/CSS
    sub_filter 'href="/' 'href="/http/$service_id/';
    sub_filter "href='/" "href='/http/$service_id/";
    sub_filter 'src="/' 'src="/http/$service_id/';
    sub_filter "src='/" "src='/http/$service_id/";
    sub_filter 'action="/' 'action="/http/$service_id/';
    sub_filter "action='/" "action='/http/$service_id/";
    sub_filter 'url(/' 'url(/http/$service_id/';
    sub_filter 'url("/' 'url("/http/$service_id/';
    sub_filter "url('/" "url('/http/$service_id/";
    
    # Rewrite JSON paths (ES6 modules, import maps)
    sub_filter '": "/' '": "/http/$service_id/';
    sub_filter '":"/' '":"/http/$service_id/';
    
    # Rewrite backend URLs in API responses (Keycloak, etc.)
    sub_filter '"http://$service_host:$service_port' '"http://$host:$server_port/http/$service_id';
    sub_filter '"https://$service_host:$service_port' '"https://$host:$server_port/http/$service_id';
    
    # Rewrite webpack public path for dynamic imports
    sub_filter 'i.p="/"' 'i.p="/http/$service_id/"';
    sub_filter 'i.p=\'/\'' 'i.p=\'/http/$service_id/\'';
    
    proxy_pass $service_protocol://$service_host:$service_port$final_path$is_args$args;
    proxy_intercept_errors off;
}

# SSH service routing via ttyd Unix domain socket
location ~ ^/ssh/([^/]+)(/.*)?$ {
    set $service_id $1;
    set $ttyd_socket_path "";
    
    access_by_lua_file /app/lua/entrypoints/ssh_service_access.lua;
    
    proxy_pass http://unix:$ttyd_socket_path;
    proxy_intercept_errors on;
    
    # WebSocket support for ttyd terminal sessions
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Extended timeouts for long-running SSH sessions
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
